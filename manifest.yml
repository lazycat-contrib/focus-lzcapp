min_os_version: 1.3.8
name: Focus
package: community.lazycat.app.focus
version: 1.0.1
description: "即时从图像中移除背景 - 一款由 withoutBG Focus v1.0.0 开源模型驱动的自托管网络应用程序，可选 Pro API 访问以获得顶级质量。"
homepage: https://github.com/withoutbg/withoutbg
author: withoutbg
application:
  subdomain: focus
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://focus:80/

services:
  focus:
    # withoutbg/app:1.0.1
    image: registry.lazycat.cloud/czyt/withoutbg/app:d38c41bf97f4f0b3
    container_name: focus
locales:
  zh:
    name: "Focus"
    description: "即时从图像中移除背景 - 一款由 withoutBG Focus v1.0.0 开源模型驱动的自托管网络应用程序，可选 Pro API 访问以获得顶级质量。"
  en:
    name: "Focus"
